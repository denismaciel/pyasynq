[package]
name = "pyasynq"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
croner = "4.0.2"
deadpool-postgres = "0.14.2"
futures-util = "0.3.34"
gethostname = "1.1.0"
hex = "0.4.3"
log = "0.4.35"
md-5 = "0.11.0"
prost = "0.14.4"
prost-types = "0.14.4"
pyo3 = { version = "0.30.1", features = ["abi3-py310", "chrono"] }
pyo3-log = "0.13.5"
rand = "0.10.3"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager", "script"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.14.0"
tokio-util = "0.7.20"
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = "1.0.11"

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"
