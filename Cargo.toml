[package]
name = "pyasynq"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
md-5 = "0.11.0"
prost = "0.14.4"
prost-types = "0.14.4"
pyo3 = { version = "0.30.1", features = ["abi3-py310", "chrono"] }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager", "script"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
prost-build = "0.14.4"
protox = "0.10.0"
