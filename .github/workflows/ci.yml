name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
          version: "0.12.4"
          python-version: "3.13"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server postgresql libpq-dev
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: make check
      - run: make test
      - run: make release-check
      - name: Free-threaded tests
        run: |
          uv python install 3.14t
          make test-ft FREETHREADED_PYTHON="$(uv python find 3.14t)" LIBPQ_DIR=/usr/lib/x86_64-linux-gnu
