name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock', 'interop/go/go.sum', 'uv.lock') }}
      - name: Lint (clippy, rustfmt, ruff, ty, mypy --strict, stubtest)
        run: nix develop -c make lint
      - name: Test (cargo, pytest incl. Go interop)
        run: nix develop -c make test
      - name: Test on free-threaded Python 3.14t (fails if the GIL turns on)
        run: nix develop -c make test-ft
