name: Release

# Pushing a tag v* builds wheels + sdist and publishes a GitHub release.
# Packages are installed directly from release assets; no PyPI publication.
# workflow_dispatch only builds, to check the matrix.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          # ring's ARM assembly needs a newer cross gcc than manylinux2014's.
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-15, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --locked --release --out dist
      # abi3 doesn't cover free-threaded builds; they need their own wheel.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.14t
            3.14
      - name: Build free-threaded wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --locked --release --out dist -i python3.14t
      - name: Smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64' && matrix.manylinux == 'auto' || startsWith(matrix.os, 'macos-')
        run: |
          python3.14 -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*abi3*.whl
          /tmp/venv/bin/python -c "import pyasynq; from pyasynq.testing import memory_url; pyasynq.Asynq(memory_url()); print(pyasynq.__version__)"
          python3.14t -m venv /tmp/venv-ft
          /tmp/venv-ft/bin/pip install dist/*cp314t*.whl
          /tmp/venv-ft/bin/python -W error -c "import sys, pyasynq; assert not sys._is_gil_enabled(); print(pyasynq.__version__, 'GIL off')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)
          # A flat package index lets uv select platform/ABI wheels and lock hashes.
          {
            printf '<!doctype html><html><body>\n'
            while read -r checksum filename; do
              printf '<a href="https://github.com/%s/releases/download/%s/%s#sha256=%s">%s</a><br>\n' \
                "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$filename" "$checksum" "$filename"
            done < dist/SHA256SUMS
            printf '</body></html>\n'
          } > dist/index.html
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          # Never overwrite published artifacts: consumers pin their hashes.
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
