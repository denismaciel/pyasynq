[build-system]
requires = ["uv_build==0.12.4", "packaging==26.2", "tomli==2.4.0; python_version < '3.11'"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "spater"
description = "asynq-compatible distributed task queue for Python, powered by Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
version = "0.5.0"
classifiers = ["Programming Language :: Python :: Free Threading :: 3 - Stable"]
dependencies = []

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20"]
otel = ["opentelemetry-api>=1.25"]

[project.scripts]
spater = "spater.cli:main"

[dependency-groups]
test = [
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
    "psycopg>=3.2",
    "pydantic>=2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "redis>=8.1.0",
]
dev = [
    { include-group = "test" },
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
# psycopg-binary has no free-threaded wheels; pure psycopg loads libpq itself.
freethreaded = [{ include-group = "test" }]

[tool.uv]
required-version = "==0.12.4"
cache-keys = [{ file = "pyproject.toml" }, { file = "build_backend.py" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "build.rs" }, { file = "src/**/*.rs" }, { file = "proto/**" }]

[tool.uv.build-backend]
module-root = "python"
module-name = "spater"
source-include = ["build_backend.py", "Cargo.toml", "Cargo.lock", "build.rs", "src/**", "proto/**", "rust-toolchain.toml", "scripts/**"]
source-exclude = ["**/*.so", "**/*.pyd", "**/*.dylib"]
wheel-exclude = ["**/*.so", "**/*.pyd", "**/*.dylib"]

[tool.native-build]
module-name = "spater._core"
cargo-library = "_core"
abi3-minimum = "cp310"
cargo-features = ["pyo3/extension-module"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["python/spater", "tests/typing"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["python", "tests"]
# Expected-error lines there use mypy's error codes; mypy checks that file.
exclude = ["tests/typing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.cibuildwheel]
build = "cp310-* cp314-* cp314t-* cp315-* cp315t-*"
build-frontend = "uv"
enable = ["cpython-prerelease"]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0"
environment = { PATH = "$HOME/.cargo/bin:$PATH", CARGO_BUILD_JOBS = "2" }
test-command = "python -W error {project}/scripts/smoke_wheel.py"
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0 && curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/0.12.4/install.sh | sh"
environment = { PATH = "$HOME/.local/bin:$HOME/.cargo/bin:$PATH", CARGO_BUILD_JOBS = "2" }
