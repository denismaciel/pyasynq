[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pyasynq"
description = "asynq-compatible distributed task queue for Python, powered by Rust"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "redis>=8.1.0",
]

[tool.maturin]
python-source = "python"
module-name = "pyasynq._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
