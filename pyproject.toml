[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pyasynq"
description = "asynq-compatible distributed task queue for Python, powered by Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20"]
otel = ["opentelemetry-api>=1.25"]

[project.scripts]
pyasynq = "pyasynq.cli:main"

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
    "pydantic>=2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "redis>=8.1.0",
]

[tool.maturin]
python-source = "python"
module-name = "pyasynq._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
