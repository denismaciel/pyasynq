[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pyasynq"
description = "asynq-compatible distributed task queue for Python, powered by Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = ["Programming Language :: Python :: Free Threading :: 3 - Stable"]
dependencies = []

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20"]
otel = ["opentelemetry-api>=1.25"]

[project.scripts]
pyasynq = "pyasynq.cli:main"

[dependency-groups]
test = [
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
    "psycopg>=3.2",
    "pydantic>=2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "redis>=8.1.0",
]
dev = [
    { include-group = "test" },
    "mypy>=1.13",
    "psycopg[binary]>=3.2",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
# psycopg-binary has no free-threaded wheels; pure psycopg loads libpq itself.
freethreaded = [{ include-group = "test" }]

[tool.maturin]
python-source = "python"
module-name = "pyasynq._core"
features = ["pyo3/extension-module"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["python/pyasynq", "tests/typing"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["python", "tests"]
# Expected-error lines there use mypy's error codes; mypy checks that file.
exclude = ["tests/typing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
